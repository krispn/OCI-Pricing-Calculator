<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCI Pricing Calculator</title>

    <!-- AG Grid Community -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-alpine.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.noStyle.js"></script>

    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- SparkMD5 for Oracle Cost Estimator hash -->
    <script src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <h1>OCI Pricing Calculator</h1>
            <span id="pricing-status" class="pricing-status">Loading prices...</span>
        </div>
        <div class="header-total">
            <span id="running-total">$0.00/month</span>
        </div>
        <div class="header-right">
            <label for="currency-select">Currency:</label>
            <select id="currency-select">
                <option value="USD" selected>USD</option>
            </select>
            <label for="hours-month">Hours/Month:</label>
            <input type="number" id="hours-month" value="744" min="1" max="744" style="width: 60px;">
            <button id="btn-refresh-prices" class="btn btn-secondary" title="Refresh prices from Oracle">&#x21BB; Refresh Prices</button>
        </div>
    </header>

    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="compute">Compute</button>
        <button class="tab-btn" data-tab="object-storage">Object Storage</button>
        <button class="tab-btn" data-tab="file-storage">File Storage</button>
        <button class="tab-btn" data-tab="database">Base DB</button>
        <button class="tab-btn" data-tab="exadata">Exadata</button>
        <button class="tab-btn" data-tab="autonomous-db">Autonomous DB</button>
        <button class="tab-btn" data-tab="network">Network</button>
        <button class="tab-btn" data-tab="summary">Summary</button>
    </nav>

    <main class="tab-content">
        <!-- Compute Tab -->
        <section id="tab-compute" class="tab-pane active">
            <div class="tab-toolbar">
                <button id="btn-add-compute" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-compute" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-compute-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="compute-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="compute-totals"></div>
        </section>

        <!-- Object Storage Tab -->
        <section id="tab-object-storage" class="tab-pane">
            <div class="tab-toolbar">
                <button id="btn-add-object-storage" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-object-storage" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-object-storage-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="object-storage-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="object-storage-totals"></div>
        </section>

        <!-- File Storage Tab -->
        <section id="tab-file-storage" class="tab-pane">
            <div class="tab-toolbar">
                <button id="btn-add-file-storage" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-file-storage" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-file-storage-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="file-storage-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="file-storage-totals"></div>
        </section>

        <!-- Database Tab -->
        <section id="tab-database" class="tab-pane">
            <div class="tab-toolbar">
                <button id="btn-add-database" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-database" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-database-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="database-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="database-totals"></div>
        </section>

        <!-- Exadata Tab -->
        <section id="tab-exadata" class="tab-pane">
            <div class="tab-toolbar">
                <button id="btn-add-exadata" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-exadata" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-exadata-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="exadata-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="exadata-totals"></div>
        </section>

        <!-- Autonomous DB Tab -->
        <section id="tab-autonomous-db" class="tab-pane">
            <div class="tab-toolbar">
                <button id="btn-add-autonomous-db" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-autonomous-db" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-autonomous-db-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="autonomous-db-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="autonomous-db-totals"></div>
        </section>

        <!-- Network Tab -->
        <section id="tab-network" class="tab-pane">
            <div class="tab-toolbar">
                <button id="btn-add-network" class="btn btn-primary">+ Add Row</button>
                <button id="btn-delete-network" class="btn btn-danger">Delete Selected</button>
                <div class="toolbar-spacer"></div>
                <button id="btn-export-network-csv" class="btn btn-secondary">Export CSV</button>
            </div>
            <div id="network-grid" class="ag-theme-alpine grid-container"></div>
            <div class="tab-totals" id="network-totals"></div>
        </section>

        <!-- Summary Tab -->
        <section id="tab-summary" class="tab-pane">
            <div class="summary-container">
                <div class="summary-table-wrapper">
                    <table id="summary-table" class="summary-table">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Monthly Cost</th>
                                <th>% of Total</th>
                            </tr>
                        </thead>
                        <tbody id="summary-body"></tbody>
                        <tfoot>
                            <tr class="summary-grand-total">
                                <td>Grand Total</td>
                                <td id="summary-grand-total">$0.00</td>
                                <td>100%</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="summary-chart" id="summary-chart"></div>
            </div>
            <div class="annual-projection">
                <h3>Annual Cost Projection</h3>
                <div class="discount-controls">
                    <label for="annual-discount">Discount %:</label>
                    <input type="number" id="annual-discount" value="0" min="0" max="100" step="0.5" style="width: 70px;">
                    <label for="projection-years">Years:</label>
                    <input type="number" id="projection-years" value="3" min="1" max="10" step="1" style="width: 50px;">
                </div>
                <table class="summary-table annual-table">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Monthly</th>
                            <th>Annual</th>
                            <th>Cumulative</th>
                        </tr>
                    </thead>
                    <tbody id="annual-body"></tbody>
                    <tfoot>
                        <tr class="summary-grand-total">
                            <td>Total</td>
                            <td></td>
                            <td></td>
                            <td id="annual-grand-total">$0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="summary-actions">
                <button id="btn-export-excel" class="btn btn-primary">Export All to Excel</button>
                <button id="btn-export-oracle" class="btn btn-primary">Export Oracle Format</button>
                <button id="btn-save-estimate" class="btn btn-secondary">Save Estimate</button>
                <button id="btn-load-estimate" class="btn btn-secondary">Load Estimate</button>
                <input type="file" id="file-load-estimate" accept=".json" style="display:none;">
            </div>
        </section>
    </main>

    <script src="js/sku-catalog.js"></script>
    <script src="js/pricing-service.js"></script>
    <script src="js/compute-grid.js"></script>
    <script src="js/object-storage-grid.js"></script>
    <script src="js/file-storage-grid.js"></script>
    <script src="js/database-grid.js"></script>
    <script src="js/exadata-grid.js"></script>
    <script src="js/autonomous-db-grid.js"></script>
    <script src="js/network-grid.js"></script>
    <script src="js/export-service.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
